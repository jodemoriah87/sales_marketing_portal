<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiffany Diamond Hotels · Sales Portal</title></head><body>
<section id="login">
 <img class="logo" src="/tiffany-logo-ltd.png" alt="Tiffany Diamond Hotels Limited" onerror="this.style.display='none'">
 <h1>Sign in to the Sales Portal</h1>
 <p class="hint">Tiffany Diamond Hotels Limited · Sales &amp; Marketing</p>
 <label for="em">Email</label><input id="em" type="email" autocomplete="username">
 <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
 <p style="margin-top:1rem"><button id="go" style="width:100%">Sign in</button></p>
</section>
<div id="app"><nav id="nav"><div class="brand"><img src="/tiffany-logo-ltd.png" alt="" onerror="this.style.display='none'">Sales Portal</div></nav><main id="view"></main></div>
<div class="toast" id="toast"></div>
<script type="module" src="/src/main.js"></script></body></html>
